# PostgreSQL 17 for Arena (render.py expects an existing database service).
# Image: offline kit images/base/postgres.tar, pushed to the mirror registry.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: arena
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: arena
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: registry.ocp4.lab.local:8443/init/arena-postgres:17-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: arena
            - name: POSTGRES_DB
              value: arena
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: arena-secrets
                  key: POSTGRES_PASSWORD
            # Subdirectory so initdb owns it (the NFS mount root is owned by root).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ['pg_isready', '-U', 'arena', '-d', 'arena']
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ['pg_isready', '-U', 'arena', '-d', 'arena']
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        storageClassName: nfs-csi
        resources:
          requests:
            storage: 20Gi
